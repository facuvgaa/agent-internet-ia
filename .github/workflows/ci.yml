name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Python Brain ────────────────────────────────────────────────────────────
  python-brain:
    name: Python Brain — lint & syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check (compile all .py files)
        run: |
          find ia-master-brain -name "*.py" -print0 \
            | xargs -0 python -m py_compile \
            && echo "✅ All Python files compile OK"

      - name: Verify LangGraph graphs build
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
          BACK_API: http://localhost:8080/api/v1/internet-ia
          BACK_RETENTION_API: http://localhost:8080/api/v1/retention
          BACK_SERVICE_API: http://localhost:8080/api/v1/available-services
          MEMORY_REDIS_URL: ""
          CONVERSATION_DB: ""
          KAFKA_BOOTSTRAP: localhost:9092
        run: |
          cd ia-master-brain
          python - <<'EOF'
          from flows.billings.graph import build_factura_graph
          from flows.retention.graph import build_retention_graph
          from flows.promise.graph import build_promice_graph
          from langgraph.checkpoint.memory import MemorySaver
          from langchain_aws import ChatBedrockConverse
          import os

          model = ChatBedrockConverse(model="anthropic.claude-3-haiku-20240307-v1:0", region_name="us-east-1")
          cp = MemorySaver()

          build_factura_graph(model, model, cp)
          build_retention_graph(model, model, cp)
          build_promice_graph(model, model, cp)
          print("✅ All LangGraph graphs compiled OK")
          EOF

  # ── Spring Boot ─────────────────────────────────────────────────────────────
  spring-boot:
    name: Spring Boot — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: cliente_back
        run: mvn --no-transfer-progress verify

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: moustro-front/package-lock.json

      - name: Install dependencies
        working-directory: moustro-front
        run: npm ci

      - name: Build
        working-directory: moustro-front
        run: npm run build
        env:
          VITE_WS_URL: /ws

  # ── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker — build all images
    runs-on: ubuntu-latest
    needs: [python-brain, spring-boot, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ia-master-brain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ia-master-brain/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build cliente_back image
        uses: docker/build-push-action@v6
        with:
          context: ./cliente_back
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build moustro-front image
        uses: docker/build-push-action@v6
        with:
          context: ./moustro-front
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
