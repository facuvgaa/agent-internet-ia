spring.application.name=cliente_back
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=websocket-bridge
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.datasource.url=jdbc:postgresql://localhost:5432/internet-db
spring.datasource.username=admin-agent
spring.datasource.password=admin-agent
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MCP Server
spring.ai.mcp.server.name=cliente-back-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.instructions=Servidor MCP para operaciones de telecomunicaciones: clientes, facturas, retención, diagnóstico de red y gestión de servicios.