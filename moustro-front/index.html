<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistente — Moustro</title>
    <style>
      /* Tema oscuro (referencia visual) + texto siempre legible */
      :root {
        --font-sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
        --bg-app: #0c0c0c;
        --bg-panel: #141414;
        --bg-messages: #1a1a1a;
        --bg-bubble-bot: #2a2a2a;
        --border-subtle: #2e2e2e;
        --text-primary: #f5f5f5;
        --text-muted: #a3a3a3;
        --text-placeholder: #737373;
        --accent-red: #b03030;
      }
      html {
        color-scheme: dark;
        height: 100%;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg-app);
        height: 100%;
        min-height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        color: var(--text-primary);
      }
      #wrap {
        display: flex;
        flex-direction: column;
        font-family: var(--font-sans);
        width: 100%;
        max-width: min(560px, 100%);
        height: 100%;
        min-height: 100dvh;
        max-height: 100dvh;
        margin: 0 auto;
        background: var(--bg-panel);
        border-left: 1px solid var(--border-subtle);
        border-right: 1px solid var(--border-subtle);
      }
      #header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-subtle);
        background: var(--bg-panel);
      }
      #header-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-red);
        flex-shrink: 0;
      }
      #header-name {
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 0.02em;
      }
      #header-status {
        font-size: 11px;
        color: var(--text-muted);
        margin-left: auto;
      }
      #chat-message-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--bg-messages);
      }
      .msg {
        max-width: 76%;
        padding: 10px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.55;
        word-break: break-word;
        color: var(--text-primary);
      }
      .msg.user {
        align-self: flex-end;
        background: var(--accent-red);
        color: #ffffff;
        border-bottom-right-radius: 4px;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--bg-bubble-bot);
        color: #f5f5f5;
        border-bottom-left-radius: 4px;
      }
      .msg img {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 5px;
        display: block;
      }
      .typing-cursor::after {
        content: '▍';
        animation: blink 0.7s infinite;
        color: var(--accent-red);
        margin-left: 1px;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      #chat-form {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px max(12px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--border-subtle);
        background: var(--bg-panel);
      }
      #chat-input {
        flex: 1;
        min-width: 0;
        padding: 10px 16px;
        border: 1px solid #404040;
        border-radius: 999px;
        font-size: 14px;
        outline: none;
        background: #1f1f1f;
        color: #ffffff;
      }
      #chat-input::placeholder {
        color: var(--text-placeholder);
        opacity: 1;
      }
      #chat-input:focus {
        border-color: var(--accent-red);
        box-shadow: 0 0 0 1px rgba(176, 48, 48, 0.35);
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: #2a2a2a;
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        stroke: #9ca3af;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Botón enviar: rojo sólido (cuadrado con esquinas redondeadas, como referencia) */
      #send-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border: none;
        background: var(--accent-red);
        cursor: pointer;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, opacity 0.15s, transform 0.1s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      #send-btn:hover:not(:disabled):not(.send-btn--inactive) {
        background: #c03838;
        transform: translateY(-1px);
      }
      #send-btn:active:not(:disabled):not(.send-btn--inactive) {
        transform: translateY(0);
      }
      #send-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: grayscale(0.15);
      }
      #send-btn.send-btn--inactive:not(:disabled) {
        opacity: 0.45;
        cursor: not-allowed;
        filter: grayscale(0.15);
      }
      #send-btn svg {
        width: 15px;
        height: 15px;
        fill: #ffffff;
        stroke: none;
        pointer-events: none;
      }
      #file-input {
        display: none;
      }
      #ball-area {
        flex-shrink: 0;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        padding: 4px 16px 0;
        gap: 8px;
        min-height: 40px;
        background: var(--bg-messages);
      }
      #ball-svg {
        width: 36px;
        height: 36px;
        overflow: visible;
        display: none;
      }
      #thinking-txt {
        font-size: 12px;
        color: var(--text-muted);
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="header">
        <div id="header-dot"></div>
        <div id="header-name">Asistente</div>
        <div id="header-status">Conectando...</div>
      </div>
      <div id="chat-message-list">
        <div class="msg bot">Hola, ¿en qué puedo ayudarte hoy?</div>
      </div>
      <div id="ball-area">
        <svg id="ball-svg" viewBox="-22 -22 44 44" xmlns="http://www.w3.org/2000/svg">
          <g id="ball-g">
            <circle cx="0" cy="0" r="14" fill="#b03030" opacity="0.9" />
            <circle cx="0" cy="0" r="14" fill="white" opacity="0.07" />
          </g>
          <circle class="pt" cx="0" cy="0" r="2.8" fill="#b03030" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2.2" fill="#882222" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2.8" fill="#b03030" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2" fill="#c04444" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2.5" fill="#882222" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2" fill="#b03030" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2.8" fill="#c04444" opacity="0" />
          <circle class="pt" cx="0" cy="0" r="2" fill="#882222" opacity="0" />
        </svg>
        <span id="thinking-txt">Pensando...</span>
      </div>
      <!-- Sin <form>: el envío implícito con Enter hacía GET a la página y metía ?message=... en la URL -->
      <div id="chat-form" role="group" aria-label="Mensaje">
        <label for="file-input" class="icon-btn">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
        </label>
        <input type="file" id="file-input" accept="image/*" />
        <input
          id="chat-input"
          name="message"
          type="text"
          placeholder="Escribí tu consulta..."
          autocomplete="off"
          enterkeyhint="send"
        />
        <button id="send-btn" type="button" aria-label="Enviar mensaje">
          <svg viewBox="0 0 24 24"><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
        </button>
      </div>
    </div>
    <!-- SockJS y StompJS via CDN — sin módulo TypeScript, sin posibilidad de fallo silencioso -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script>
      (function () {
        'use strict';

        var CUSTOMER_ID = '1';
        var WS_URL = 'http://localhost:8080/ws';

        var msgList   = document.getElementById('chat-message-list');
        var chatInput = document.getElementById('chat-input');
        var sendBtn   = document.getElementById('send-btn');
        var statusEl  = document.getElementById('header-status');
        var ballSvg   = document.getElementById('ball-svg');
        var thinkingTxt = document.getElementById('thinking-txt');
        var ballG     = document.getElementById('ball-g');
        var pts       = Array.from(document.querySelectorAll('.pt'));
        var fileInput = document.getElementById('file-input');

        var busy = false;
        var stompReady = false;
        var pendingResolve = null;
        var pendingImage = null;

        /* ── helpers DOM ───────────────────────────────────── */
        function addMsg(text, who, img) {
          var d = document.createElement('div');
          d.className = 'msg ' + who;
          if (text) d.textContent = text;
          if (img) {
            var im = document.createElement('img');
            im.src = img;
            d.appendChild(im);
          }
          msgList.appendChild(d);
          msgList.scrollTop = msgList.scrollHeight;
          return d;
        }

        function typeWriter(el, text, speed) {
          speed = speed || 15;
          var i = 0;
          el.textContent = '';
          el.classList.add('typing-cursor');
          return new Promise(function (res) {
            var iv = setInterval(function () {
              el.textContent += text[i++];
              msgList.scrollTop = msgList.scrollHeight;
              if (i >= text.length) {
                clearInterval(iv);
                el.classList.remove('typing-cursor');
                res();
              }
            }, speed);
          });
        }

        /* ── animación pelota ──────────────────────────────── */
        var ANGLES = [0,45,90,135,180,225,270,315].map(function(a){ return a*Math.PI/180; });
        var DIST = 22;
        var floatRaf = null;
        var floatT = 0;

        function ease(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

        function setPt(el, x, y, op){
          el.setAttribute('cx', x.toFixed(2));
          el.setAttribute('cy', y.toFixed(2));
          el.setAttribute('opacity', op.toFixed(3));
        }

        function animOut(done){
          var t=0;
          (function run(){
            t=Math.min(t+0.055,1); var e=ease(t);
            ballG.setAttribute('opacity',(1-e).toFixed(3));
            ballG.setAttribute('transform','scale('+(1-e*0.85).toFixed(3)+')');
            pts.forEach(function(p,i){
              var d=e*DIST;
              setPt(p,Math.cos(ANGLES[i])*d,Math.sin(ANGLES[i])*d,e>0.05?Math.min(e*1.3,1):0);
            });
            if(t<1) requestAnimationFrame(run); else if(done) done();
          })();
        }

        function startFloat(){
          floatT=0;
          var base=ANGLES.map(function(a){ return {bx:Math.cos(a)*DIST,by:Math.sin(a)*DIST}; });
          (function run(){
            floatT+=0.035;
            pts.forEach(function(p,i){
              var ox=Math.sin(floatT*1.1+i*0.8)*3;
              var oy=Math.cos(floatT*0.9+i*0.6)*3;
              var op=0.45+0.55*Math.sin(floatT*1.8+i);
              setPt(p,base[i].bx+ox,base[i].by+oy,op);
            });
            floatRaf=requestAnimationFrame(run);
          })();
        }

        function animIn(done){
          if(floatRaf!=null) cancelAnimationFrame(floatRaf);
          var snap=pts.map(function(p){
            return {x:parseFloat(p.getAttribute('cx')||'0'),y:parseFloat(p.getAttribute('cy')||'0')};
          });
          var t=0;
          ballG.setAttribute('opacity','0');
          ballG.setAttribute('transform','scale(0)');
          (function run(){
            t=Math.min(t+0.048,1); var e=ease(t);
            var sc=e<0.8?e/0.8:1+0.07*Math.sin(((e-0.8)/0.2)*Math.PI);
            ballG.setAttribute('transform','scale('+sc.toFixed(3)+')');
            ballG.setAttribute('opacity',e.toFixed(3));
            pts.forEach(function(p,i){
              setPt(p,snap[i].x*(1-e),snap[i].y*(1-e),(1-e)>0.02?1-e:0);
            });
            if(t<1) requestAnimationFrame(run);
            else { pts.forEach(function(p){ setPt(p,0,0,0); }); if(done) done(); }
          })();
        }

        function showBall(){
          ballSvg.style.display='block';
          thinkingTxt.style.display='block';
          statusEl.textContent='Pensando...';
        }

        function hideBall(){
          ballSvg.style.display='none';
          thinkingTxt.style.display='none';
          statusEl.textContent = stompReady ? 'En línea' : 'Desconectado';
        }

        /* ── envío ─────────────────────────────────────────── */
        function doSend(){
          if(busy) return;
          var text = chatInput.value.trim();
          var img  = pendingImage;
          if(!text && !img) return;

          addMsg(text || null, 'user', img || null);
          chatInput.value = '';
          chatInput.placeholder = 'Escribí tu consulta...';
          pendingImage = null;

          if(!stompReady){
            addMsg('Sin conexión con el servidor (Spring Boot :8080). Levantalo y recargá la página.', 'bot');
            return;
          }

          busy = true;

          showBall();
          animOut(function(){
            startFloat();
            var timer = setTimeout(function(){
              pendingResolve = null;
              if(floatRaf!=null) cancelAnimationFrame(floatRaf);
              animIn(function(){
                hideBall();
                addMsg('Sin respuesta del servidor (60 s)', 'bot');
                busy = false;
                chatInput.focus();
              });
            }, 60000);

            pendingResolve = function(txt){
              clearTimeout(timer);
              pendingResolve = null;
              if(floatRaf!=null) cancelAnimationFrame(floatRaf);
              animIn(function(){
                hideBall();
                setTimeout(function(){
                  var botDiv = addMsg('', 'bot');
                  typeWriter(botDiv, txt).then(function(){
                    busy = false;
                    chatInput.focus();
                  });
                }, 120);
              });
            };

            stompClient.publish({
              destination: '/app/chat',
              body: JSON.stringify({ contenido: text || '(imagen)', customerId: CUSTOMER_ID })
            });
          });
        }

        /* ── imagen ────────────────────────────────────────── */
        fileInput.addEventListener('change', function(){
          var file = fileInput.files && fileInput.files[0];
          if(!file) return;
          var reader = new FileReader();
          reader.onload = function(ev){
            pendingImage = ev.target.result;
            chatInput.placeholder = 'Imagen adjunta...';
          };
          reader.readAsDataURL(file);
        });

        /* ── eventos envío ─────────────────────────────────── */
        sendBtn.addEventListener('click', doSend);

        chatInput.addEventListener('keydown', function(e){
          if(e.key !== 'Enter') return;
          e.preventDefault();
          doSend();
        });

        /* ── STOMP ─────────────────────────────────────────── */
        var stompClient = new StompJs.Client({
          webSocketFactory: function(){ return new SockJS(WS_URL); },
          reconnectDelay: 5000,
          onConnect: function(){
            stompReady = true;
            statusEl.textContent = 'En línea';
            stompClient.subscribe('/user/' + CUSTOMER_ID + '/queue/chat', function(msg){
              try {
                var data = JSON.parse(msg.body);
                if(pendingResolve) pendingResolve(data.respuesta || String(msg.body));
              } catch(e) {
                if(pendingResolve) pendingResolve(String(msg.body));
              }
            });
          },
          onDisconnect: function(){
            stompReady = false;
            statusEl.textContent = 'Desconectado';
          },
          onWebSocketError: function(){
            statusEl.textContent = 'Error de conexión';
          }
        });

        stompClient.activate();

      })();
    </script>
  </body>
</html>
