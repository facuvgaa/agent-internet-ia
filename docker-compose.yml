services: 
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-internet
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    
  postgrest:
    image: postgres:15
    container_name: conversations_db
    ports:
    - 5433:5433
    environment:
      POSTGRES_USER: admin-llm
      POSTGRES_PASSWORD: admin-llm
      POSTGRES_DB: conversation-db
    volumes:
      - postgres_data_conversation:/var/lib/postgresql/data
  postgres:
    image: postgres:15
    container_name: postgrest-agent
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin-agent
      POSTGRES_PASSWORD: admin-agent
      POSTGRES_DB: internet-db
    volumes:
      - postgres_data_internet:/var/lib/postgresql/data

  redis:
   image: redis:7
   container_name: redis_memory
   ports:
   - "6379:6379"
   volumes:
   - redis_data_conversation:/var/lib/redis/data

volumes:
  redis_data_conversation:
  postgres_data_internet:
  postgres_data_conversation: