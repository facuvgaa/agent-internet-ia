services:

  # ── Infraestructura ────────────────────────────────────────────────────────

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-internet
    ports:
      - "9092:9092"      
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-internet:9093'
      # PLAINTEXT → acceso desde el host (localhost:9092)
      # PLAINTEXT_INTERNAL → acceso desde otros contenedores (kafka-internet:29092)
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_INTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka-internet:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  postgres:
    image: postgres:15
    container_name: postgrest-agent
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin-agent
      POSTGRES_PASSWORD: admin-agent
      POSTGRES_DB: internet-db
    volumes:
      - postgres_data_internet:/var/lib/postgresql/data

  postgrest:
    image: postgres:15
    container_name: conversations_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin-llm
      POSTGRES_PASSWORD: admin-llm
      POSTGRES_DB: conversation-db
    volumes:
      - postgres_data_conversation:/var/lib/postgresql/data

  redis:
    image: redis/redis-stack:latest
    container_name: redis_memory
    ports:
      - "6379:6379"
    volumes:
      - redis_data_conversation:/var/lib/redis/data

  # ── Aplicaciones ───────────────────────────────────────────────────────────

  cliente_back:
    build:
      context: ./cliente_back
    container_name: cliente-back
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-internet:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgrest-agent:5432/internet-db
      SPRING_DATASOURCE_USERNAME: admin-agent
      SPRING_DATASOURCE_PASSWORD: admin-agent
    depends_on:
      - kafka
      - postgres

  ia_brain:
    build:
      context: .
      dockerfile: ia-master-brain/Dockerfile
    container_name: ia-master-brain
    environment:
      KAFKA_BOOTSTRAP: kafka-internet:29092
      MEMORY_REDIS_URL: redis://redis_memory:6379
      CONVERSATION_DB: postgresql://admin-llm:admin-llm@conversations_db:5432/conversation-db
      BACK_API: http://cliente-back:8080/api/v1/internet-ia
      BACK_RETENTION_API: http://cliente-back:8080/api/v1/retention
      BACK_SERVICE_API: http://cliente-back:8080/api/v1/available-services
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_PRIMARY_LLM: ${AWS_PRIMARY_LLM:-anthropic.claude-3-haiku-20240307-v1:0}
      AWS_SECOND_LLM: ${AWS_SECOND_LLM:-us.anthropic.claude-sonnet-4-6}
    depends_on:
      - kafka
      - redis
      - postgrest
      - cliente_back
    restart: on-failure

  moustro_front:
    build:
      context: ./moustro-front
    container_name: moustro-front
    ports:
      - "80:80"
    depends_on:
      - cliente_back

volumes:
  redis_data_conversation:
  postgres_data_internet:
  postgres_data_conversation:
